name: Validate Game Data

on:
  push:
    branches: [main]
    paths:
      - 'src/data/games.ts'
  pull_request:

jobs:
  validate-game-data:
    name: Check no game has forceFirst set
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run game data integrity tests
        run: npx vitest run --reporter=verbose -t "Game data integrity"
